<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #1716161d;
            /* Define uma imagem como plano de fundo */
            background-image: url('https://i.pinimg.com/originals/6d/d1/2a/6dd12a43413989fcdfeff0f9b8b46f20.gif');
            /* Define uma imagem como plano de fundo */
            background-repeat: no-repeat;
            /* Faz a imagem não se repetir */
            background-size: cover;
            /* Faz a imagem cobrir todo o plano de fundo */
            background-position: center;
            /* Centraliza a imagem no plano de fundo */
            background-attachment: fixed;
            /* Fixa a imagem no plano de fundo */
            width: 50%;
            margin: auto;
        }

        p {
            color: rgb(255, 255, 255);
            /* Define a cor do texto */
            font-family: 'Arial Black', sans-serif;
            /* Define a fonte do texto */
            font-size: 60px;
            /* Define o tamanho da fonte */

            text-align: center;
            /* Centraliza o texto */
            text-shadow: 4px 4px 2px rgba(0, 0, 0, 0.5);
            /* Sombra do texto */

            width: 50%;
            /* Largura do texto */

            height: 100px;
            /* Altura do texto */

            /* padding: 20px; */
            /* Preenchimento do texto */

            /* margin: 20px; */
            /* Margem do texto */
        }

        #foto-perfil {
            width: 10%;
            /* Largura da imagem */
            height: 10%;
            /* Altura da imagem */
            padding: 20px;
            /* Preenchimento da imagem */
            margin: 20px;
            /* Margem da imagem */
            border-radius: 50%;
            /* Arredonda os cantos da imagem */
            float: right;
        }

        .imagens-ovais {
            width: 10%;
            /* Largura da imagem */
            height: 10%;
            /* Altura da imagem */
            /* padding: 20px; */
            /* Preenchimento da imagem */
            /* margin: 20px; */
            /* Margem da imagem */
            border-radius: 50%;
            /* Arredonda os cantos da imagem */
            border-color: #f7f4f4;
            border-width: 5px;
            border-style: dotted;
        }

        h2 {
            font-family: 'Arial Black', sans-serif;
            /* Define a fonte do texto */
            width: 5%;
            /* Define a largura do texto */
            background-color: #f7f4f4;
            /* Define a cor de fundo do texto */
            border: dotted 10px greenyellow;
        }

        #about-me {
            font-family: 'Arial Black', sans-serif;
            /* Define a fonte do texto */
            font-size: 20px;
            /* Define o tamanho da fonte */
            text-align: left;
            /* Centraliza o texto */
            text-shadow: 4px 4px 2px rgba(0, 0, 0, 0.5);
            /* Sombra do texto */
        }
    </style>
    <title>Meu Site Bonito</title>
</head>

<body>

    <p>Hi, There! This is my pretty website</p>

    <img id="foto-perfil" src="https://cdn.pfps.gg/pfps/8538-avatar-the-last-airbender.png" alt="AangPfp">
    <img class="imagens-ovais"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3wlS8Xso5pgvPpUHbjXjeL17tQDBaCAzBaCy6FbQ_hRCdRDi6LoUSQyw&s=10"
        alt="AangPfp">

    <h2>About me</h2>
    <p id="about-me">Hi, I'm the Avatar</p>

</body>

</html>
